<!doctype html>
<!-- SPDX-License-Identifier: MIT -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>user-reactions demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --card: #fff;
        --line: #dde1e6;
        --muted: #5b6573;
        --accent: #2563eb;
        --ok: #15803d;
        --bad: #b91c1c;
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111418;
          --card: #1a1f25;
          --line: #2c333c;
          --muted: #9aa4b2;
          --accent: #7aa2ff;
          --ok: #4ade80;
          --bad: #f87171;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: CanvasText; }
      header { padding: 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
      header h1 { font-size: 17px; margin: 0; }
      header p { margin: 0; color: var(--muted); font-size: 13px; }
      header label { margin-left: auto; font-size: 14px; display: flex; gap: 6px; align-items: center; }
      main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px); gap: 16px; padding: 16px; max-width: 1200px; margin: 0 auto; }
      @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
      .chat { display: flex; flex-direction: column; gap: 12px; }
      .msg { padding: 12px 14px; border-radius: 12px; max-width: 46em; }
      .user { align-self: flex-end; background: var(--accent); color: #fff; }
      .assistant { background: var(--card); border: 1px solid var(--line); }
      .assistant p { margin: 0 0 10px; }
      .assistant user-reactions { --ur-muted: var(--muted); --ur-accent: var(--accent); font-size: 13px; }
      .regen { margin-top: 8px; font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--accent); background: none; color: var(--accent); cursor: pointer; }
      .more { align-self: center; font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: inherit; cursor: pointer; }
      aside { position: sticky; top: 16px; align-self: start; background: var(--card); border: 1px solid var(--line); border-radius: 12px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; }
      @media (max-width: 860px) { aside { position: static; max-height: 60vh; } }
      aside h2 { font-size: 14px; margin: 0; padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
      aside h2 button { font: inherit; font-size: 12px; background: none; border: none; color: var(--accent); cursor: pointer; }
      #log { list-style: none; margin: 0; padding: 0; overflow: auto; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
      #log li { padding: 8px 12px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
      #log b { font-weight: 600; }
      #log .s2 { color: var(--ok); }
      #log .s4, #log .s5, #log .err { color: var(--bad); }
      #log .ev { color: var(--accent); }
      #log pre { margin: 4px 0 0; white-space: pre-wrap; color: var(--muted); }
    </style>
  </head>
  <body>
    <header>
      <h1>&lt;user-reactions&gt; demo</h1>
      <p>Fake AI chat. Each answer has a thumbs widget (comment on thumbs down). Scroll to trigger impressions.</p>
      <label><input type="checkbox" id="outage" /> Simulate API outage (503)</label>
    </header>
    <main>
      <section class="chat" id="chat" aria-label="Conversation"></section>
      <aside aria-label="Request and event log">
        <h2>Mock API and events <button type="button" id="clear">Clear</button></h2>
        <ul id="log"></ul>
      </aside>
    </main>
    <script type="module" src="/src/index.ts"></script>
    <script type="module" src="./demo.ts"></script>
  </body>
</html>
