# SPDX-License-Identifier: MIT
# Publishes to npm and creates a GitHub Release when a version tag (v1.2.3, v1.2.3-beta.1) is pushed.
#
#   npm version 0.1.0 && git push --follow-tags
#
# 1. verify  – tag matches package.json, tag is on main, full test suite, build, package check.
# 2. publish – waits for approval in the "npm-publish" environment, then publishes the exact
#              files verified in step 1 using npm trusted publishing (OIDC, no token stored).
# One-time setup: docs/releasing.md.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Tag must match package.json and be on main
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG points to a commit that is not on main"
            exit 1
          fi
          # Pre-releases (1.2.3-beta.1) go to the "next" dist-tag so they never become the default install.
          case "$version" in *-*) dist_tag=next ;; *) dist_tag=latest ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run pack:check

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@user-reactions/widget
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm trusted publishing (OIDC)
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Require npm with trusted publishing support (>= 11.5.1)
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a==11&&(b>5||(b==5&&c>=1)))?0:1)" "$(npm --version)" \
            || { echo "::error::npm $(npm --version) is too old for trusted publishing"; exit 1; }

      - name: Use the verified build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to npm
        env:
          # Bootstrap only: the very first publish uses a short-lived token stored as the
          # NPM_TOKEN secret of the npm-publish environment (see docs/releasing.md). Delete it
          # afterwards; with no token npm uses trusted publishing (OIDC).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        # --ignore-scripts: publish exactly the files verified above instead of rebuilding.
        # Provenance can only be generated from a public repository.
        run: |
          provenance=""
          [ "$REPO_PRIVATE" = false ] && provenance="--provenance"
          npm publish --access public --tag "$DIST_TAG" --ignore-scripts $provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sri="sha384-$(openssl dgst -sha384 -binary dist/user-reactions.js | openssl base64 -A)"
          url="https://cdn.jsdelivr.net/npm/@user-reactions/widget@$VERSION/dist/user-reactions.js"
          cat > notes.md <<EOF
          ## Install

          \`\`\`html
          <script src="$url"
            integrity="$sri" crossorigin="anonymous" defer></script>
          \`\`\`

          \`\`\`sh
          npm install @user-reactions/widget@$VERSION
          \`\`\`

          Published to npm with dist-tag \`$DIST_TAG\`.

          EOF
          prerelease=""
          [ "$DIST_TAG" = next ] && prerelease="--prerelease"
          gh release create "$TAG" dist/user-reactions.js dist/user-reactions.mjs \
            --verify-tag --title "$TAG" --notes-file notes.md --generate-notes $prerelease
