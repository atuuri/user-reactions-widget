# SPDX-License-Identifier: MIT
# Tests every pull request and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, contract and embed tests
        run: npm test

      - name: Build (fails above the 8 kB size budget)
        run: npm run build

      - name: Check the npm package as a consumer sees it
        run: npm run pack:check

      - name: Size report
        if: matrix.node == 22
        run: |
          {
            echo '### Bundle size'
            echo '```'
            npm run --silent size
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
